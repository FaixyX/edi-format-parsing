# fly.toml app configuration file generated for billup on 2025-12-06T23:26:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'billup'
primary_region = 'lax'

[build]
  dockerfile = "Dockerfile"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"  # let Fly stop when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']


  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"          # or "/" if you don’t have a health route
    timeout = "5s"

[processes]
  app = "/app/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8080"


[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
